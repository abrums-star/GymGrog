<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GymGrog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-title" content="GymGrog">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>
  <div id="timer" class="timer hidden"></div>
  <div id="lightbox" class="lightbox hidden"></div>
  <nav id="nav">
    <button data-view="home">Home</button>
    <button data-view="program">Program</button>
    <button data-view="history">History</button>
    <button data-view="weight">Weight</button>
    <button data-view="settings">Settings</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
